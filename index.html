<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="PathedIn — the living career path. Where you've been, where you are, where you want to go. Don't just ask who you know; ask who you should know to get where you want to go." />
    <meta name="theme-color" content="#f8f6f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PathedIn" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>PathedIn</title>
    <script>
      // Apply the saved appearance before first paint (light unless the viewer chose otherwise).
      try {
        var s = JSON.parse(localStorage.getItem('pathedin:v1') || '{}');
        var t = (s.state && s.state.theme) || 'light';
        if (s.version !== 1 && t === 'system') t = 'light';
        if (t !== 'system') document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
